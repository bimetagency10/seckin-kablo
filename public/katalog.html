<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141416;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
 height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;background:#1B1B1E;
 border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
header img{height:30px}
.ttl{font-size:13px;letter-spacing:2px;opacity:.55;text-transform:uppercase}
.spacer{flex:1}
button{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.12);
 border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
button:hover:not(:disabled){background:#C4161C;border-color:#C4161C}
button:disabled{opacity:.3;cursor:default}
select{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.12);
 border-radius:8px;padding:7px 10px;font-size:12.5px;max-width:180px}
select option{background:#1B1B1E}
.sk-btn{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.12);
 border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;transition:.15s;
 white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.sk-btn:hover{background:#C4161C;border-color:#C4161C}
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:16px}
#book{position:relative;transform-style:preserve-3d;perspective:2600px;display:flex}
.leaf{position:relative;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden}
.leaf img{width:100%;height:100%;display:block;object-fit:contain;background:#fff}
.gut{position:absolute;top:0;bottom:0;width:26px;pointer-events:none;z-index:3}
.gut.l{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22))}
.gut.r{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.22))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:22px;z-index:10;padding:0}
#prev{left:14px}#next{right:14px}
footer{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 20px;
 background:#1B1B1E;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
#slider{width:min(46vw,460px);accent-color:#C4161C}
#pgno{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;opacity:.7;min-width:92px;text-align:center}
.flip{animation:fl .42s ease-in-out}
@keyframes fl{0%{opacity:.35;transform:rotateY(-7deg) scale(.985)}100%{opacity:1;transform:none}}
#thumbs{position:absolute;left:0;right:0;bottom:0;background:rgba(12,12,14,.97);
 border-top:1px solid rgba(255,255,255,.1);padding:12px;display:none;gap:9px;overflow-x:auto;z-index:20}
#thumbs.on{display:flex}
#thumbs img{height:120px;border-radius:3px;cursor:pointer;opacity:.55;transition:.15s;border:2px solid transparent}
#thumbs img:hover,#thumbs img.cur{opacity:1;border-color:#C4161C}
@media(max-width:820px){header{gap:10px;padding:10px 12px}.ttl{display:none}#slider{width:38vw}}

      THUMBS = ["katalog/t001.webp", "katalog/t002.webp", "katalog/t003.webp", "katalog/t004.webp", "katalog/t005.webp", "katalog/t006.webp", "katalog/t007.webp", "katalog/t008.webp", "katalog/t009.webp", "katalog/t010.webp", "katalog/t011.webp", "katalog/t012.webp", "katalog/t013.webp", "katalog/t014.webp", "katalog/t015.webp", "katalog/t016.webp", "katalog/t017.webp", "katalog/t018.webp", "katalog/t019.webp", "katalog/t020.webp", "katalog/t021.webp", "katalog/t022.webp", "katalog/t023.webp", "katalog/t024.webp", "katalog/t025.webp", "katalog/t026.webp", "katalog/t027.webp", "katalog/t028.webp", "katalog/t029.webp", "katalog/t030.webp", "katalog/t031.webp", "katalog/t032.webp", "katalog/t033.webp", "katalog/t034.webp", "katalog/t035.webp", "katalog/t036.webp", "katalog/t037.webp", "katalog/t038.webp", "katalog/t039.webp", "katalog/t040.webp", "katalog/t041.webp", "katalog/t042.webp", "katalog/t043.webp", "katalog/t044.webp", "katalog/t045.webp", "katalog/t046.webp", "katalog/t047.webp", "katalog/t048.webp", "katalog/t049.webp", "katalog/t050.webp", "katalog/t051.webp", "katalog/t052.webp", "katalog/t053.webp", "katalog/t054.webp", "katalog/t055.webp", "katalog/t056.webp", "katalog/t057.webp", "katalog/t058.webp", "katalog/t059.webp", "katalog/t060.webp", "katalog/t061.webp", "katalog/t062.webp", "katalog/t063.webp", "katalog/t064.webp", "katalog/t065.webp", "katalog/t066.webp", "katalog/t067.webp", "katalog/t068.webp", "katalog/t069.webp", "katalog/t070.webp", "katalog/t071.webp", "katalog/t072.webp", "katalog/t073.webp", "katalog/t074.webp", "katalog/t075.webp", "katalog/t076.webp", "katalog/t077.webp", "katalog/t078.webp", "katalog/t079.webp", "katalog/t080.webp", "katalog/t081.webp", "katalog/t082.webp", "katalog/t083.webp", "katalog/t084.webp"],
      TOC = [["Kapak", 1], ["İçindekiler", 2], ["Data Kabloları", 3], ["Koaksiyel Kablolar", 12], ["CCTV Kamera Kabloları", 35], ["Yangın Alarm Kabloları", 50], ["Sinyal Kontrol Kabloları", 57], ["Kumanda Kabloları", 65], ["Telefon Kabloları", 71], ["Solar Kablolar", 74], ["PUR Kablolar", 76], ["Yangına Dayanıklı Kablolar", 79]];
const N = PAGES.length;
let cur = 1, spread = true;
const book = document.getElementById('book'), stage = document.getElementById('stage');
const slider = document.getElementById('slider'), pgno = document.getElementById('pgno');
slider.max = N;

const jump = document.getElementById('jump');
TOC.forEach(([n, p]) => { const o = document.createElement('option'); o.value = p; o.textContent = n; jump.appendChild(o); });
jump.onchange = () => go(+jump.value);

function sizes(count) {
  const availH = stage.clientHeight - 32, availW = stage.clientWidth - 140;
  const ar = 210 / 297;
  let h = availH, w = h * ar * count;
  if (w > availW) { w = availW; h = w / (ar * count); }
  return [w / count, h];
}
function render() {
  const showTwo = spread && cur > 1 && cur < N;
  let list;
  if (!showTwo) list = [cur];
  else { const left = cur % 2 === 0 ? cur : cur - 1; list = [left, left + 1].filter(p => p <= N); }
  const [w, h] = sizes(list.length);
  book.innerHTML = list.map((p, i) => `<div class="leaf flip" style="width:${w}px;height:${h}px">
      <img src="${PAGES[p-1]}" alt="Sayfa ${p}" decoding="async" fetchpriority="high">
      ${list.length===2 ? `<div class="gut ${i===0?'l':'r'}"></div>` : ''}</div>`).join('');
  slider.value = cur;
  pgno.textContent = (list.length === 2 ? list[0] + '–' + list[1] : cur) + ' / ' + N;
  document.getElementById('prev').disabled = cur <= 1;
  document.getElementById('next').disabled = cur >= N;
  document.querySelectorAll('#thumbs img').forEach((t, i) => t.classList.toggle('cur', i + 1 === cur));
  let sec = TOC[0][1];
  for (const [, p] of TOC) if (cur >= p) sec = p;
  jump.value = sec;
}
const prefetched = new Set();
function prefetch(p) {
  if (p < 1 || p > N || prefetched.has(p)) return;
  prefetched.add(p);
  const im = new Image(); im.decoding = 'async'; im.src = PAGES[p-1];
}
function prefetchNeighbors() {
  const step = (spread && cur > 1 && cur < N) ? 2 : 1;
  [cur + step, cur - step, cur + step*2].forEach(prefetch);
}
function go(p) { cur = Math.min(N, Math.max(1, p)); render();
  (window.requestIdleCallback || setTimeout)(prefetchNeighbors, 1); }
function step(d) { go(cur + (spread && cur > 1 && cur < N ? 2 * d : d)); }
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('first').onclick = () => go(1);
document.getElementById('last').onclick = () => go(N);
slider.oninput = e => go(+e.target.value);
document.getElementById('mode').onclick = e => { spread = !spread; e.target.textContent = spread ? 'Çift Sayfa' : 'Tek Sayfa'; render(); };
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
const th = document.getElementById('thumbs');
document.getElementById('tg').onclick = () => {
  th.classList.toggle('on');
  if (th.childElementCount === 0)
    THUMBS.forEach((s, i) => { const im = new Image(); im.loading = 'lazy'; im.src = s; im.alt = 'Sayfa ' + (i + 1); im.onclick = () => { go(i + 1); th.classList.remove('on'); }; th.appendChild(im); });
  render();
};
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1);
  if (e.key === 'Home') go(1); if (e.key === 'End') go(N);
});
let x0 = null;
stage.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
stage.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 45) step(dx < 0 ? 1 : -1);
  x0 = null;
}, {passive:true});
addEventListener('resize', render);
render();
(window.requestIdleCallback || setTimeout)(prefetchNeighbors, 500);
</script></body></html>
